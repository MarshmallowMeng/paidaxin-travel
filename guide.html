<!DOCTYPE html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>派大欣 · 出行指南</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body data-active="guide">
    <div class="app">
      <div data-include="topbar"></div>

      <nav class="features" aria-label="指南分类">
        <a class="feature-item" href="#visa">
          <span class="feature-emoji" aria-hidden="true">🛂</span>
          <span class="feature-label">签证入境</span>
        </a>
        <a class="feature-item" href="#transport">
          <span class="feature-emoji" aria-hidden="true">🚇</span>
          <span class="feature-label">交通出行</span>
        </a>
        <a class="feature-item" href="#budget">
          <span class="feature-emoji" aria-hidden="true">💰</span>
          <span class="feature-label">预算省钱</span>
        </a>
        <a class="feature-item" href="#tips">
          <span class="feature-emoji" aria-hidden="true">📌</span>
          <span class="feature-label">注意事项</span>
        </a>
      </nav>

      <main>
        <section id="visa" class="section" aria-labelledby="visa-title">
          <div class="section-head">
            <h2 id="visa-title" class="section-title">签证入境</h2>
          </div>
          <div class="news-list" aria-label="签证入境">
            <a class="news-item" href="tickets.html">
              <img class="news-thumb" src="assets/opt/pdx_pic2.jpg?v=4" alt="签证入境" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「最新政策」赴俄签证与入境要点</h3>
                <p class="news-summary">签证类型、所需材料、办理周期、海关申报与边检沟通建议。</p>
              </div>
            </a>
          </div>
        </section>

        <section id="transport" class="section" aria-labelledby="transport-title">
          <div class="section-head">
            <h2 id="transport-title" class="section-title">交通出行</h2>
          </div>
          <div class="news-list" aria-label="交通出行">
            <a class="news-item" href="routes.html">
              <img class="news-thumb" src="assets/opt/pdx_pic1.jpg?v=4" alt="交通出行" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「如何高效移动」城内交通与城际衔接</h3>
                <p class="news-summary">地铁、巴士、Sapsan 高铁、机场快线;电子票/Troika 卡使用方法。</p>
              </div>
            </a>
          </div>
        </section>

        <section id="budget" class="section" aria-labelledby="budget-title">
          <div class="section-head">
            <h2 id="budget-title" class="section-title">预算省钱</h2>
          </div>
          <div class="news-list" aria-label="预算省钱">
            <a class="news-item" href="local.html">
              <img class="news-thumb" src="assets/opt/pdx_pic3.jpg?v=4" alt="预算省钱" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「花钱有数」每日预算与替代方案</h3>
                <p class="news-summary">参考人均、餐饮档位、景点联票、淡旺季价差与省钱小技巧。</p>
              </div>
            </a>
          </div>
        </section>

        <section id="tips" class="section" aria-labelledby="tips-title">
          <div class="section-head">
            <h2 id="tips-title" class="section-title">注意事项</h2>
          </div>
          <div class="news-list" aria-label="注意事项">
            <a class="news-item" href="share.html">
              <img class="news-thumb" src="assets/opt/pdx_pic4.jpg?v=4" alt="注意事项" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「冷暖与安全」着装、通讯与紧急联系</h3>
                <p class="news-summary">分季节着装清单、SIM/eSIM 选择、翻译工具、突发情况下的求助方式。</p>
              </div>
            </a>
          </div>
        </section>
      </main>

      <div data-include="bottomnav"></div>
    </div>

    <script src="app.js?v=4"></script>
  </body>
</html>
