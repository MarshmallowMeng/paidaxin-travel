<!DOCTYPE html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>派大欣环游记 · 名片</title>
    <link rel="icon" type="image/x-icon" href="assets/opt/favicon.ico" />
    <link rel="apple-touch-icon" href="assets/opt/apple-touch-icon.png?v=17" />
    <link rel="stylesheet" href="styles.css?v=17" />
  </head>
  <body data-active="me">
    <div class="app">
      <div data-include="topbar"></div>

      <main>
        <section class="section" aria-labelledby="card-title">
          <div class="section-head">
            <h2 id="card-title" class="section-title">派大欣 · 旅行名片</h2>
          </div>

          <div class="card-hero">
            <img class="card-hero-avatar" src="assets/opt/logo-512.webp?v=17" alt="派大欣环游记" width="96" height="96" loading="eager" />
            <h3 class="card-hero-name">派大欣</h3>
            <p class="card-hero-role">俄罗斯持证向导 · 莫圣双城线路定制</p>
            <div class="tag-row" style="justify-content:center;">
              <span class="tag">中俄双语</span>
              <span class="tag">极光摄影</span>
              <span class="tag">芭蕾票务</span>
              <span class="tag">家庭友好</span>
            </div>
          </div>

          <div class="card-info" aria-label="联系方式">
            <div class="card-info-row">
              <span class="card-info-key">微信</span>
              <span class="card-info-val" id="wx-id">paidaxin_travel</span>
            </div>
            <div class="card-info-row">
              <span class="card-info-key">邮箱</span>
              <span class="card-info-val">hi@paidaxin.travel</span>
            </div>
            <div class="card-info-row">
              <span class="card-info-key">所在城市</span>
              <span class="card-info-val">莫斯科 / 圣彼得堡</span>
            </div>
            <div class="card-info-row">
              <span class="card-info-key">服务范围</span>
              <span class="card-info-val">城市半日 / 全日陪同 · 跨城衔接 · 极光团 · 票务代购</span>
            </div>
            <div class="card-info-row">
              <span class="card-info-key">擅长线路</span>
              <span class="card-info-val">双城经典 5 日 · 极光之约 9 日 · 金环小镇加段</span>
            </div>
          </div>

          <div class="card-cta">
            <button type="button" class="btn btn-primary" id="copy-wx">复制微信号</button>
            <a class="btn btn-secondary" href="mailto:hi@paidaxin.travel?subject=%E6%B4%BE%E5%A4%A7%E6%AC%A3%E5%92%A8%E8%AF%A2">发邮件咨询</a>
          </div>
        </section>
      </main>

      <div data-include="bottomnav"></div>
    </div>

    <script src="app.js?v=17"></script>
    <script>
      (() => {
        const btn = document.getElementById("copy-wx");
        const wx = document.getElementById("wx-id");
        if (!btn || !wx) return;
        btn.addEventListener("click", async () => {
          const text = wx.textContent.trim();
          try {
            await navigator.clipboard.writeText(text);
            const old = btn.textContent;
            btn.textContent = "已复制 ✓";
            setTimeout(() => (btn.textContent = old), 1500);
          } catch (e) {
            // 降级:选中文本提示用户手动复制
            const range = document.createRange();
            range.selectNodeContents(wx);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            btn.textContent = "请长按复制";
            setTimeout(() => (btn.textContent = "复制微信号"), 2000);
          }
        });
      })();
    </script>
  </body>
</html>
