<!DOCTYPE html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>派大欣环游记 · 特色体验详情</title>
    <link rel="icon" type="image/x-icon" href="assets/opt/favicon.ico" />
    <link rel="apple-touch-icon" href="assets/opt/apple-touch-icon.png?v=21" />
    <link rel="stylesheet" href="styles.css?v=21" />
    <style>
      .spot-hero { margin: 0 -16px 12px; }
      .spot-hero img { width: 100%; height: auto; display: block; aspect-ratio: 16/10; object-fit: cover; }
      .spot-titlewrap { padding: 14px 0 4px; }
      .spot-name { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
      .spot-ru { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
      .spot-lead { font-size: 14px; line-height: 1.6; margin: 0 0 14px; color: var(--text); }
      .spot-meta-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; margin-bottom: 14px; }
      .spot-meta-row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
      .spot-meta-row:last-child { border-bottom: none; }
      .spot-meta-row dt { width: 80px; flex-shrink: 0; color: var(--muted); font-size: 13px; margin: 0; }
      .spot-meta-row dd { flex: 1; min-width: 0; margin: 0; color: var(--text); line-height: 1.55; }
      .tip-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 14px 32px; margin: 0 0 14px; font-size: 14px; line-height: 1.65; }
      .tip-list li { margin: 4px 0; }
      .empty { padding: 80px 16px; text-align: center; color: var(--muted); font-size: 14px; }
      .empty .empty-emoji { font-size: 48px; display: block; margin-bottom: 12px; }
      .back-row { padding: 8px 0 4px; }
      .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); text-decoration: none; }
      .back-link:active { color: var(--text); }
      .type-badge { display: inline-block; padding: 2px 10px; font-size: 12px; color: var(--surface); background: var(--accent); border-radius: 999px; margin-bottom: 8px; }
    </style>
  </head>
  <body data-active="discover">
    <div class="app">
      <div data-include="topbar"></div>

      <main>
        <div class="back-row">
          <a class="back-link" href="javascript:history.back()">‹ 返回</a>
        </div>
        <div id="exp-root"></div>
      </main>

      <div data-include="bottomnav"></div>
    </div>

    <script src="experiences-data.js?v=21"></script>
    <script src="app.js?v=21"></script>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const root = document.getElementById("exp-root");
        const item = id && window.EXP_DB ? window.EXP_DB[id] : null;

        if (!item) {
          root.innerHTML = `
            <div class="empty">
              <span class="empty-emoji">✨</span>
              没有找到这个项目。<br />
              <a class="back-link" style="margin-top:14px;display:inline-block" href="experiences.html">‹ 回到特色体验列表</a>
            </div>
          `;
          return;
        }

        document.title = `派大欣环游记 · ${item.title}`;

        const typeLabel = { spot: "推荐景点", experience: "特色体验" };

        const metaHtml = (item.meta || []).map(([k, v]) => `
          <div class="spot-meta-row">
            <dt>${k}</dt>
            <dd>${v}</dd>
          </div>
        `).join("");

        const tipsHtml = (item.tips || []).map(t => `<li>${t}</li>`).join("");
        const tagsHtml = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join("");

        root.innerHTML = `
          <div class="spot-hero">
            <img src="assets/opt/spot-${item.img}-480.webp?v=21" alt="${item.title}" loading="eager" />
          </div>
          <div class="spot-titlewrap">
            <span class="type-badge">${typeLabel[item.type] || ""}</span>
            <h1 class="spot-name">${item.title}</h1>
            ${item.ru ? `<p class="spot-ru">${item.ru}</p>` : ""}
          </div>
          ${tagsHtml ? `<div class="tag-row" style="margin:0 0 12px">${tagsHtml}</div>` : ""}
          <p class="spot-lead">${item.lead}</p>

          ${metaHtml ? `<div class="spot-meta-card"><dl style="margin:0">${metaHtml}</dl></div>` : ""}

          ${tipsHtml ? `
            <div class="section-head" style="margin-bottom:8px">
              <h2 class="section-title">小贴士</h2>
            </div>
            <ul class="tip-list">${tipsHtml}</ul>
          ` : ""}
        `;
      })();
    </script>
  </body>
</html>
