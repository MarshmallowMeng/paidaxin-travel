<!DOCTYPE html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>派大欣环游记 · 景点信息</title>
    <link rel="icon" type="image/x-icon" href="assets/opt/favicon.ico" />
    <link rel="apple-touch-icon" href="assets/opt/apple-touch-icon.png?v=18" />
    <link rel="stylesheet" href="styles.css?v=18" />
  </head>
  <body data-active="discover">
    <div class="app">
      <div data-include="topbar"></div>

      <main>
        <section class="section" aria-labelledby="spots-title">
          <div class="section-head">
            <h2 id="spots-title" class="section-title">景点信息</h2>
          </div>

          <p class="notice">
            <strong>信息时间:</strong>截至 2026 年 5 月公开资料整理。
            票价 / 开放时间 / 闭馆日 经常变动,
            <strong>请以景点官网与售票页面为准</strong>,出发前再确认一遍最稳。
            点击任意卡片进入<strong>景点详情页</strong>。
          </p>

          <div class="chip-row" role="tablist" aria-label="城市筛选">
            <button class="chip is-active" type="button" data-city="all">全部</button>
            <button class="chip" type="button" data-city="moscow">莫斯科</button>
            <button class="chip" type="button" data-city="spb">圣彼得堡</button>
            <button class="chip" type="button" data-city="murmansk">摩尔曼斯克</button>
            <button class="chip" type="button" data-city="vladivostok">海参崴</button>
          </div>

          <div class="news-list" aria-label="景点列表" id="spot-list">
            <!-- 列表由 spots-data.js 渲染 -->
          </div>
        </section>
      </main>

      <div data-include="bottomnav"></div>
    </div>

    <script src="spots-data.js?v=18"></script>
    <script src="app.js?v=18"></script>
    <script>
      (() => {
        const list = document.getElementById("spot-list");
        const db = window.SPOT_DB || {};
        // 城市排序:莫斯科 → 圣彼得堡 → 摩尔曼斯克 → 海参崴
        const cityOrder = { moscow: 0, spb: 1, murmansk: 2, vladivostok: 3 };
        const cityLabel = { moscow: "莫斯科", spb: "圣彼得堡", murmansk: "摩尔曼斯克", vladivostok: "海参崴" };

        const items = Object.entries(db).sort((a, b) => {
          return (cityOrder[a[1].city] ?? 99) - (cityOrder[b[1].city] ?? 99);
        });

        list.innerHTML = items.map(([id, s]) => {
          const tags = (s.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
          return `
            <a class="news-item" href="spot.html?id=${id}" data-city="${s.city}">
              <img class="news-thumb" src="assets/opt/spot-${s.img}-thumb.webp?v=18" alt="${s.title}" width="96" height="96" loading="lazy" />
              <div class="news-text">
                <h3 class="news-title">${s.title}</h3>
                <p class="news-summary news-summary--clamp">${s.lead}</p>
                <div class="tag-row">${tags}</div>
              </div>
            </a>
          `;
        }).join("");

        // 城市筛选
        const chips = document.querySelectorAll(".chip[data-city]");
        const allItems = list.querySelectorAll("[data-city]");
        chips.forEach((chip) => {
          chip.addEventListener("click", () => {
            const key = chip.dataset.city;
            chips.forEach((c) => c.classList.toggle("is-active", c === chip));
            allItems.forEach((it) => {
              if (key === "all" || it.dataset.city === key) it.style.display = "";
              else it.style.display = "none";
            });
          });
        });
      })();
    </script>
  </body>
</html>
