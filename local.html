<!DOCTYPE html>
<html lang="zh-Hans-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f8" />
    <title>派大欣 · 本地推荐</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body data-active="local">
    <div class="app">
      <div data-include="topbar"></div>

      <nav class="features" aria-label="快捷入口">
        <a class="feature-item" href="#food">
          <span class="feature-emoji" aria-hidden="true">🍜</span>
          <span class="feature-label">美食</span>
        </a>
        <a class="feature-item" href="#stay">
          <span class="feature-emoji" aria-hidden="true">🏨</span>
          <span class="feature-label">住宿</span>
        </a>
        <a class="feature-item" href="#shop">
          <span class="feature-emoji" aria-hidden="true">🛍️</span>
          <span class="feature-label">购物</span>
        </a>
        <a class="feature-item" href="#show">
          <span class="feature-emoji" aria-hidden="true">🎭</span>
          <span class="feature-label">演出</span>
        </a>
      </nav>

      <main>
        <section id="food" class="section" aria-labelledby="food-title">
          <div class="section-head">
            <h2 id="food-title" class="section-title">美食</h2>
          </div>
          <div class="news-list" aria-label="美食推荐">
            <a class="news-item" href="spots.html">
              <img class="news-thumb" src="assets/opt/pdx_pic2.jpg?v=4" alt="美食推荐" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「精选餐厅」避雷清单与预约建议</h3>
                <p class="news-summary">人均、招牌菜、是否需要预约、外语菜单情况——后续接入真实餐厅信息后,这里会变成可筛选的推荐列表。</p>
              </div>
            </a>
          </div>
        </section>

        <section id="stay" class="section" aria-labelledby="stay-title">
          <div class="section-head">
            <h2 id="stay-title" class="section-title">住宿</h2>
          </div>
          <div class="news-list" aria-label="住宿推荐">
            <a class="news-item" href="spots.html">
              <img class="news-thumb" src="assets/opt/pdx_pic1.jpg?v=4" alt="住宿推荐" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「住哪里更顺」城区选择与避坑</h3>
                <p class="news-summary">莫斯科与圣彼得堡推荐落脚的核心区域、地铁通达度、酒店/民宿对比。</p>
              </div>
            </a>
          </div>
        </section>

        <section id="shop" class="section" aria-labelledby="shop-title">
          <div class="section-head">
            <h2 id="shop-title" class="section-title">购物</h2>
          </div>
          <div class="news-list" aria-label="购物推荐">
            <a class="news-item" href="spots.html">
              <img class="news-thumb" src="assets/opt/pdx_pic3.jpg?v=4" alt="购物推荐" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「带什么回家」纪念品 & 当地特产</h3>
                <p class="news-summary">伴手礼推荐、采购地点、退税须知。</p>
              </div>
            </a>
          </div>
        </section>

        <section id="show" class="section" aria-labelledby="show-title">
          <div class="section-head">
            <h2 id="show-title" class="section-title">演出</h2>
            <a class="section-more" href="tickets.html">代查 ›</a>
          </div>
          <div class="news-list" aria-label="演出推荐">
            <a class="news-item" href="tickets.html">
              <img class="news-thumb" src="assets/opt/pdx_pic4.jpg?v=4" alt="演出推荐" width="192" height="192" loading="eager" />
              <div class="news-text">
                <h3 class="news-title">「不踩坑」芭蕾、马戏、音乐厅</h3>
                <p class="news-summary">大剧院、马林斯基、莫斯科大马戏的购票方式、推荐档期与座位选择。</p>
              </div>
            </a>
          </div>
        </section>
      </main>

      <div data-include="bottomnav"></div>
    </div>

    <script src="app.js?v=4"></script>
  </body>
</html>
